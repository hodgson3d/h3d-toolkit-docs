site_name: H3D Toolkit Documentation
site_description: Documentation for H3D Toolkit for Blender
site_url: https://hodgson3d.github.io/h3d-toolkit-docs/
repo_url: https://github.com/hodgson3d/h3d-toolkit-docs
repo_name: hodgson3d/h3d-toolkit-docs
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Interface Overview: getting-started/interface-overview.md
      - Adding Images & GIFs: getting-started/adding-images-and-gifs.md
  - Navigation: navigation-tools/index.md
  - Lattice: lattice-tools/index.md
  - Shape Key: shape-key-tools/index.md
  - UV: uv-tools/index.md
  - Curve: curve-tools/index.md
  - Material: material-tools/index.md
  - Object: mesh-tools/index.md
  - Modelling: modelling-tools/index.md
  - Modifier: modifier-tools/index.md
  - Selection: selection-tools/index.md
  - Mesh Clean: mesh-clean-tools/index.md
  - Sculpt: sculpt-tools/index.md
  - Vertex Group: vertex-group-tools/index.md
  - Transfer: transfer-tools/index.md
  - Camera: camera-tools/index.md
  - VSE: vse-tools/index.md
  - Troubleshooting: troubleshooting/faq.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; H3D Toolkit
